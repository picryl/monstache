name: Monstache CI

on:
  push:
    branches: [ '**' ]

jobs:
  test:
    name: Run e2e tests (${{ matrix.search.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        search:
          # Monstache rel6 documents Elasticsearch 7.0+ support and uses the
          # Elasticsearch 7 client. OpenSearch jobs run in Elasticsearch
          # compatibility mode.
          - name: elasticsearch-7.0.0
            flavor: elasticsearch
            image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.0.0
          - name: elasticsearch-7.17.29
            flavor: elasticsearch
            image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
          - name: opensearch-1.3.19
            flavor: opensearch
            image: opensearchproject/opensearch:1.3.19
          - name: opensearch-2.19.5
            flavor: opensearch
            image: opensearchproject/opensearch:2.19.5
    steps:
      - uses: actions/checkout@v6
      - name: Verify test report renderer
        run: docker/test/go-test-summary_test.sh
      - name: Run e2e tests
        env:
          SEARCH_FLAVOR: ${{ matrix.search.flavor }}
          SEARCH_IMAGE: ${{ matrix.search.image }}
          TEST_REPORT_TITLE: E2E tests (${{ matrix.search.name }})
        run: |
          cd docker/test
          ./run-tests.sh
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-report-${{ matrix.search.name }}
          path: docker/test/test-results/
          if-no-files-found: warn
          retention-days: 14
